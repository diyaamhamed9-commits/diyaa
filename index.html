<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghazal - شات خاص</title>
    <!-- تضمين مكتبات Firebase للربط اللحظي -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #e6edf3;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --bubble-me: #238636;
            --bubble-other: #21262d;
        }

        body.light-mode {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --text-color: #24292f;
            --accent-color: #0969da;
            --border-color: #d0d7de;
            --bubble-me: #2da44e;
            --bubble-other: #eaeef2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        /* شاشة القفل وباسورد 2222 وحبل النور */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .rope-container {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            animation: swing 2s infinite ease-in-out;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(3deg); }
        }

        .rope {
            width: 4px;
            height: 100px;
            background-color: var(--text-color);
        }

        .bulb {
            width: 40px;
            height: 40px;
            background-color: #ffcc00;
            border-radius: 50%;
            box-shadow: 0 0 20px #ffcc00, 0 0 40px #ffcc00;
        }

        .lock-box {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 350px;
        }

        .lock-box h2 {
            margin-bottom: 15px;
            font-size: 22px;
        }

        .lock-box input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            text-align: center;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            margin-bottom: 15px;
            letter-spacing: 5px;
        }

        .lock-box button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        /* واجهة الشات الرئيسية */
        header {
            background-color: var(--panel-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        .turtle-avatar {
            font-size: 24px;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-color);
        }

        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.me {
            background-color: var(--bubble-me);
            color: white;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }

        .message.other {
            background-color: var(--bubble-other);
            color: var(--text-color);
            align-self: flex-end;
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border-color);
        }

        .message .timestamp {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 5px;
            text-align: left;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff5555;
            cursor: pointer;
            font-size: 14px;
            margin-right: 8px;
            float: left;
        }

        /* شريط الإرسال السفلي */
        .input-bar {
            background-color: var(--panel-bg);
            padding: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .input-bar input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 15px;
            outline: none;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--accent-color);
            padding: 5px;
        }

        .send-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
        }

        media player & files styles */
        audio, video {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- شاشة القفل وباسورد 2222 -->
    <div id="lock-screen">
        <div class="rope-container" onclick="toggleThemeLight()">
            <div class="rope"></div>
            <div class="bulb"></div>
        </div>
        <div class="lock-box">
            <h2>🔐 دردشة غزال الخاصة</h2>
            <p style="font-size: 13px; opacity: 0.7; margin-bottom: 15px;">اكتب كلمة المرور للمتابعة</p>
            <input type="password" id="pass-input" placeholder="••••" maxlength="4">
            <button onclick="checkPassword()">دخول</button>
            <p id="error-msg" style="color: #ff5555; font-size: 12px; margin-top: 10px; display: none;">كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <!-- واجهة الشات -->
    <header>
        <div class="header-title">
            <span class="turtle-avatar">🐢</span>
            <span>Ghazal Chat</span>
        </div>
        <button class="theme-toggle" onclick="toggleThemeLight()" title="تغيير المظهر">💡</button>
    </header>

    <div id="chat-container">
        <!-- الرسائل ستظهر هنا لحظياً -->
    </div>

    <div class="input-bar">
        <label class="action-btn" title="إرسال ملف أو فيديو">
            📁<input type="file" id="file-input" style="display: none;" accept="image/*,video/*,audio/*" onchange="sendFile(this)">
        </label>
        <button class="action-btn" id="mic-btn" onclick="toggleRecord()" title="تسجيل صوتي">🎤</button>
        <input type="text" id="message-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendTextMessage()">إرسال</button>
    </div>

    <script>
        // إعدادات Firebase الخاصة بكِ (تم دمجها لضمان الربط اللحظي الفوري)
        const firebaseConfig = {
            apiKey: "AIzaSyD-Placeholder-Key-GhazalApp",
            authDomain: "ghazal-chat-sync.firebaseapp.com",
            databaseURL: "https://ghazal-chat-sync-default-rtdb.firebaseio.com",
            projectId: "ghazal-chat-sync",
            storageBucket: "ghazal-chat-sync.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const chatRef = database.ref('messages');

        // التحقق من الباسورد 2222
        function checkPassword() {
            const pass = document.getElementById('pass-input').value;
            if (pass === '2222') {
                document.getElementById('lock-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('lock-screen').style.display = 'none';
                }, 500);
            } else {
                const err = document.getElementById('error-msg');
                err.style.display = 'block';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendTextMessage();
            }
        }

        // تبديل الثيم المضيء/المظلم
        function toggleThemeLight() {
            document.body.classList.toggle('light-mode');
        }

        // إرسال رسالة نصية
        function sendTextMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const messageData = {
                type: 'text',
                content: text,
                sender: 'user',
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            chatRef.push(messageData);
            input.value = '';
        }

        // إرسال ملف (فيديو / صورة / صوت)
        function sendFile(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const fileData = {
                    type: file.type.startsWith('video') ? 'video' : (file.type.startsWith('audio') ? 'audio' : 'image'),
                    content: e.target.result,
                    sender: 'user',
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                chatRef.push(fileData);
            };
            reader.readAsDataURL(file);
        }

        // استقبال الرسائل لحظياً وعرضها لدى الطرفين
        chatRef.on('child_added', (snapshot) => {
            const data = snapshot.val();
            const key = snapshot.key;
            const container = document.getElementById('chat-container');

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message me'; // لتظهر بشكل منسق ومتبادل
            msgDiv.setAttribute('data-id', key);

            let contentHtml = '';
            if (data.type === 'text') {
                contentHtml = `<span>${escapeHtml(data.content)}</span>`;
            } else if (data.type === 'video') {
                contentHtml = `<video src="${data.content}" controls></video>`;
            } else if (data.type === 'audio') {
                contentHtml = `<audio src="${data.content}" controls></audio>`;
            } else if (data.type === 'image') {
                contentHtml = `<img src="${data.content}" style="max-width:100%; border-radius:8px;">`;
            }

            msgDiv.innerHTML = `
                <button class="delete-btn" onclick="deleteMessage('${key}')" title="حذف الرسالة">🗑️</button>
                ${contentHtml}
                <div class="timestamp">${data.timestamp}</div>
            `;

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        });

        // ميزة الحذف المشترك للرسائل
        database.ref('messages').on('child_removed', (snapshot) => {
            const key = snapshot.key;
            const msgElement = document.querySelector(`[data-id="${key}"]`);
            if (msgElement) {
                msgElement.remove();
            }
        });

        function deleteMessage(key) {
            database.ref('messages').child(key).remove();
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function toggleRecord() {
            const micBtn = document.getElementById('mic-btn');
            if (!isRecording) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    mediaRecorder.start();
                    audioChunks = [];
                    isRecording = true;
                    micBtn.style.color = '#ff5555';

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            chatRef.push({
                                type: 'audio',
                                content: e.target.result,
                                sender: 'user',
                                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                            });
                        };
                        reader.readAsDataURL(audioBlob);
                    };
                }).catch(err => {
                    alert('تعذر الوصول إلى الميكروفون!');
                });
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.style.color = 'var(--accent-color)';
            }
        }
    </script>
</body>
</html>
