<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غزل ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #05030a;
            color: #555;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 1s ease;
        }

        body.light-on {
            background: linear-gradient(135deg, #0f0c1b, #241b35, #302b63);
            color: #fff;
        }

        .pull-chain-container {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
            cursor: pointer;
        }

        .chain {
            width: 3px;
            height: 120px;
            background: #444;
            transition: 0.3s;
        }

        body.light-on .chain {
            background: #a78bfa;
        }

        .chain-ring {
            width: 14px;
            height: 14px;
            border: 3px solid #555;
            border-radius: 50%;
            background: #222;
            transition: 0.3s;
        }

        body.light-on .chain-ring {
            border-color: #db2777;
            background: #f472b6;
            box-shadow: 0 0 10px #db2777;
        }

        .bulb-top {
            width: 25px;
            height: 15px;
            background: #333;
            border-radius: 5px 5px 0 0;
        }

        #main-wrapper {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        body.light-on #main-wrapper {
            opacity: 1;
            visibility: visible;
        }

        #login-screen {
            background: rgba(25, 20, 40, 0.9);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 0 35px rgba(138, 43, 226, 0.6);
            text-align: center;
            width: 380px;
            border: 1px solid rgba(244, 114, 182, 0.4);
        }

        .site-title {
            font-family: 'Amiri', serif;
            font-size: 48px;
            color: #f472b6;
            text-shadow: 0 0 15px rgba(244, 114, 182, 0.9), 0 0 5px #db2777;
            margin: 0;
        }

        .turtle-box {
            margin: 15px auto;
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.4);
            animation: float 2s infinite ease-in-out;
        }

        .turtle-box img {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .subtitle {
            color: #a78bfa;
            font-size: 14px;
            margin-bottom: 15px;
        }

        #login-screen input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 15px 0;
            background: rgba(15, 12, 27, 0.9);
            border: 2px solid #7c3aed;
            border-radius: 12px;
            color: #fff;
            text-align: center;
            font-size: 18px;
            outline: none;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.4);
        }

        #login-screen button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(219, 39, 119, 0.5);
            transition: 0.3s;
        }

        #login-screen button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(219, 39, 119, 0.8);
        }

        #chat-screen {
            display: none;
            width: 100%;
            max-width: 650px;
            height: 92vh;
            background: rgba(20, 16, 35, 0.9);
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(124, 58, 237, 0.5);
            border: 1px solid rgba(124, 58, 237, 0.4);
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .chat-header {
            background: rgba(30, 24, 50, 0.95);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(124, 58, 237, 0.3);
        }

        .chat-header img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        .chat-header h2 {
            font-family: 'Amiri', serif;
            color: #f472b6;
            font-size: 22px;
            margin: 0;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 15px;
            word-wrap: break-word;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 15px;
        }

        .message.sent {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }

        .message.received {
            background: rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .msg-body {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .msg-time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            align-self: flex-end;
        }

        audio {
            max-width: 200px;
            height: 35px;
        }

        video {
            max-width: 220px;
            border-radius: 10px;
            outline: none;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #fca5a5;
            cursor: pointer;
            font-size: 13px;
            padding: 2px;
        }

        .chat-input-area {
            padding: 12px 15px;
            background: rgba(20, 16, 35, 0.95);
            display: flex;
            gap: 8px;
            border-top: 1px solid rgba(124, 58, 237, 0.3);
            align-items: center;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            background: rgba(15, 12, 27, 0.9);
            border: 1px solid #7c3aed;
            border-radius: 12px;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .action-btn {
            background: rgba(124, 58, 237, 0.3);
            border: 1px solid #7c3aed;
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: rgba(124, 58, 237, 0.6);
        }

        #mic-btn.recording {
            background: #f43f5e;
            border-color: #ffe4e6;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        #send-btn {
            background: linear-gradient(135deg, #db2777, #f472b6);
            border: none;
            font-weight: bold;
            padding: 10px 14px;
        }
    </style>
</head>
<body>

    <div class="pull-chain-container" onclick="toggleLight()" title="اضغط لشد الحبل وتشغيل النور!">
        <div class="bulb-top"></div>
        <div class="chain"></div>
        <div class="chain-ring"></div>
    </div>

    <div id="main-wrapper">
        <div id="login-screen">
            <h1 class="site-title">غزل</h1>
            <div class="turtle-box">
                <img src="turtle.png" alt="Cute Turtle">
            </div>
            <p class="subtitle">المكان كان ضلمة! اكتبي الباسورد عشان تدخلي ✨</p>
            <input type="password" id="pass-input" placeholder="كلمة المرور...">
            <button onclick="login()">دخول 🚀</button>
            <p id="err" style="color: #f43f5e; margin-top: 10px; display: none; font-size: 14px;">الباسورد غلط، جربي تاني!</p>
        </div>

        <div id="chat-screen">
            <div class="chat-header">
                <img src="turtle.png" alt="Turtle">
                <div>
                    <h2>غزل</h2>
                    <p style="font-size: 11px; color: #a78bfa;">محادثة متكاملة (نصوص، صوت، فيديو، حذف، وقت وتاريخ)</p>
                </div>
            </div>
            
            <div class="chat-messages" id="msg-container"></div>

            <div class="chat-input-area">
                <!-- زر رفع الفيديوهات -->
                <button class="action-btn" onclick="document.getElementById('video-file-input').click()" title="إرسال فيديو">📁</button>
                <input type="file" id="video-file-input" accept="video/*" style="display: none;" onchange="sendVideo(event)">

                <!-- زر تسجيل الصوت -->
                <button class="action-btn" id="mic-btn" onclick="toggleRecord()" title="تسجيل رسالة صوتية">🎤</button>

                <!-- خانة الكتابة -->
                <input type="text" id="user-msg" placeholder="اكتبي رسالتك هنا..." onkeypress="handleEnter(event)">
                <button class="action-btn" id="send-btn" onclick="sendMessage()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function toggleLight() {
            document.body.classList.toggle("light-on");
        }

        window.onload = function() {
            loadMessages();
        }

        window.addEventListener('storage', function(e) {
            if (e.key === 'ghazal_complete_chat') {
                loadMessages();
            }
        });

        function login() {
            let p = document.getElementById("pass-input").value;
            if (p === "2222") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("chat-screen").style.display = "flex";
                loadMessages();
            } else {
                document.getElementById("err").style.display = "block";
            }
        }

        // دالة استخراج الوقت وتاريخ الإرسال بتنسيق دقيق
        function getDateTimeString() {
            let now = new Date();
            let day = now.getDate();
            let month = now.getMonth() + 1;
            let year = now.getFullYear();
            let dateStr = day + '/' + month + '/' + year;

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let ampm = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            let timeStr = hours + ':' + minutes + ' ' + ampm;

            return dateStr + ' - ' + timeStr;
        }

        function loadMessages() {
            let container = document.getElementById("msg-container");
            let savedMsgs = localStorage.getItem("ghazal_complete_chat");
            
            if (!savedMsgs) {
                container.innerHTML = `<div class="message received"><div class="msg-body"><span>أهلاً بكِ يا ضياء في شات غزل المتكامل 🐢✨</span><span class="msg-time">الآن</span></div></div>`;
                return;
            }

            let messages = JSON.parse(savedMsgs);
            container.innerHTML = "";

            messages.forEach((msg, index) => {
                let msgDiv = document.createElement("div");
                msgDiv.className = "message " + msg.type;

                let bodyDiv = document.createElement("div");
                bodyDiv.className = "msg-body";

                // فحص نوع المحتوى (نص، صوت، أو فيديو)
                if (msg.contentType === "text") {
                    let textSpan = document.createElement("span");
                    textSpan.innerText = msg.content;
                    bodyDiv.appendChild(textSpan);
                } else if (msg.contentType === "audio") {
                    let audioEl = document.createElement("audio");
                    audioEl.controls = true;
                    audioEl.src = msg.content;
                    bodyDiv.appendChild(audioEl);
                } else if (msg.contentType === "video") {
                    let videoEl = document.createElement("video");
                    videoEl.controls = true;
                    videoEl.src = msg.content;
                    bodyDiv.appendChild(videoEl);
                }

                let timeSpan = document.createElement("span");
                timeSpan.className = "msg-time";
                timeSpan.innerText = msg.time;
                bodyDiv.appendChild(timeSpan);

                let deleteBtn = document.createElement("button");
                deleteBtn.className = "delete-btn";
                deleteBtn.innerHTML = "🗑️";
                deleteBtn.title = "حذف الرسالة";
                deleteBtn.onclick = function() {
                    deleteMessage(index);
                };

                msgDiv.appendChild(bodyDiv);
                msgDiv.appendChild(deleteBtn);
                container.appendChild(msgDiv);
            });

            container.scrollTop = container.scrollHeight;
        }

        // حفظ وإرسال رسالة نصية
        function sendMessage() {
            let input = document.getElementById("user-msg");
            let text = input.value.trim();
            if (text === "") return;

            saveNewMessage({
                contentType: "text",
                content: text,
                type: "sent",
                time: getDateTimeString()
            });

            input.value = "";
        }

        // تسجيل وإرسال رسالة صوتية
        function toggleRecord() {
            let micBtn = document.getElementById("mic-btn");

            if (!isRecording) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        let audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        let reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = function() {
                            saveNewMessage({
                                contentType: "audio",
                                content: reader.result,
                                type: "sent",
                                time: getDateTimeString()
                            });
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    micBtn.classList.add("recording");
                    micBtn.innerText = "⏹️";
                }).catch(err => {
                    alert("يرجى السماح بالوصول إلى الميكروفون لتسجيل الصوت!");
                });
            } else {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove("recording");
                micBtn.innerText = "🎤";
            }
        }

        // اختيار وإرسال الفيديو
        function sendVideo(event) {
            let file = event.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = function() {
                saveNewMessage({
                    contentType: "video",
                    content: reader.result,
                    type: "sent",
                    time: getDateTimeString()
                });
            };
        }

        function saveNewMessage(msgObj) {
            let savedMsgs = localStorage.getItem("ghazal_complete_chat");
            let messages = savedMsgs ? JSON.parse(savedMsgs) : [];
            messages.push(msgObj);
            localStorage.setItem("ghazal_complete_chat", JSON.stringify(messages));
            loadMessages();
        }

        function deleteMessage(index) {
            let savedMsgs = localStorage.getItem("ghazal_complete_chat");
            if (!savedMsgs) return;

            let messages = JSON.parse(savedMsgs);
            messages.splice(index, 1);
            localStorage.setItem("ghazal_complete_chat", JSON.stringify(messages));
            loadMessages();
        }

        function handleEnter(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
